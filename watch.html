<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub — Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <div class="nav__brand">STREAM<span>HUB</span></div>
    <nav class="nav__links">
      <a href="index.html">Browse</a>
      <a href="watchlist.html">My List</a>
    </nav>
    <div class="nav__auth" id="navAuth"></div>
  </header>

  <div class="player-wrap">
    <div class="player">
      <video id="videoPlayer" controls></video>
    </div>

    <div class="watch-info">
      <div class="watch-info__top">
        <div>
          <h1 id="videoTitle"></h1>
          <p class="watch-info__meta" id="videoMeta"></p>
        </div>
        <button id="watchlistBtn" class="btn">+ My List</button>
      </div>
      <p class="watch-info__desc" id="videoDesc"></p>
    </div>
  </div>

  <div id="related"></div>

  <footer class="footer">
    <p>StreamHub — a practice project. Videos are public-domain sample clips; data is stored locally in your browser.</p>
  </footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/watch.js"></script>
</body>
</html>
