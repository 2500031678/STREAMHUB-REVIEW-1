<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <a href="login.html" class="nav__brand">STREAM<span>HUB</span></a>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to pick up where you left off.</p>

      <p id="authError" class="auth-error" hidden></p>

      <form id="loginForm" class="auth-form">
        <label>Email
          <input type="email" id="email" required autocomplete="email">
        </label>
        <label>Password
          <input type="password" id="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn--active auth-submit">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
